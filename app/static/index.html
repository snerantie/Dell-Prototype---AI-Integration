<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EduConnect AI Tutor</title>
  <style>
    :root { --bg:#0b141a; --panel:#111b21; --in:#202c33; --out:#005c4b;
            --accent:#00a884; --txt:#e9edef; --muted:#8696a0;
            --qr-bg:#ffffff; --qr-hover:#eefaf5; --qr-disabled:#8696a0; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,Segoe UI,Roboto,sans-serif;
           background:var(--bg); color:var(--txt); height:100vh; display:flex;
           flex-direction:column; }
    header { background:var(--panel); padding:10px 16px; display:flex;
             align-items:center; gap:12px; border-bottom:1px solid #222d34; }
    header .avatar { width:38px; height:38px; border-radius:50%;
             background:var(--accent); display:grid; place-items:center;
             font-weight:700; color:#03110d; font-size:14px; }
    header h1 { font-size:15px; margin:0; line-height:1.2; }
    header .status { font-size:12px; color:var(--muted); margin:2px 0 0;
             display:flex; align-items:center; gap:6px; }
    header .status .dot { width:7px; height:7px; border-radius:50%;
             background:#25d366; box-shadow:0 0 6px #25d366; }
    header .meta { margin-left:auto; display:flex; align-items:center; gap:6px; }
    header .meta select { background:var(--in); color:var(--txt);
             border:1px solid #2a3942; border-radius:6px; padding:4px 6px;
             font-size:11px; opacity:0.75; }
    header .meta select:hover, header .meta select:focus { opacity:1; }
    header .menu-link { color:var(--muted); text-decoration:none; font-size:20px;
             padding:2px 6px; border-radius:6px; }
    header .menu-link:hover { color:var(--txt); background:#1a242a; }

    /* Hidden handoff container kept in DOM for USSD -> WhatsApp deep-linking. */
    #handoff-ribbon { display:none; }

    #chat { flex:1; overflow-y:auto; padding:18px; display:flex;
            flex-direction:column; gap:8px;
            background:
              linear-gradient(rgba(11,20,26,.85), rgba(11,20,26,.85)),
              repeating-linear-gradient(45deg, #0f1a20 0 2px, transparent 2px 22px); }
    .msg { max-width:78%; padding:8px 12px; border-radius:10px; font-size:14px;
           line-height:1.4; white-space:pre-wrap; word-wrap:break-word; }
    .user { align-self:flex-end; background:var(--out); }
    .bot  { align-self:flex-start; background:var(--in); }
    .bot-group { align-self:flex-start; max-width:78%; display:flex;
                 flex-direction:column; gap:6px; }
    .bot-group .msg { max-width:100%; }
    .diag { align-self:flex-start; max-width:78%; font-size:12px;
            color:var(--muted); background:#0e171d; border:1px dashed #2a3942;
            border-radius:8px; padding:8px 10px; }
    .diag b { color:var(--accent); }

    /* WhatsApp Business Interactive Reply Buttons — pill-shaped, attached
       to the bot bubble they belong to. */
    .quick-replies { display:flex; flex-wrap:wrap; gap:6px; margin-top:2px; }
    .quick-reply { background:var(--qr-bg); color:var(--accent);
             border:1px solid var(--accent); border-radius:20px;
             padding:8px 16px; font-size:13px; font-weight:600;
             cursor:pointer; font-family:inherit;
             transition:background .12s, transform .05s, box-shadow .12s; }
    .quick-reply:hover { background:var(--qr-hover);
             box-shadow:0 1px 4px rgba(0,168,132,.25); }
    .quick-reply:active { transform:translateY(1px); }
    .quick-reply:disabled { background:#1a242a; color:var(--qr-disabled);
             border-color:#2a3942; cursor:not-allowed;
             box-shadow:none; font-weight:500; }

    #composer { display:flex; gap:8px; padding:12px 16px;
             background:var(--panel); border-top:1px solid #222d34; }
    #composer input { flex:1; background:var(--in); color:var(--txt);
             border:none; border-radius:20px; padding:10px 16px; font-size:14px; }
    #composer button { background:var(--accent); color:#03110d; border:none;
             border-radius:20px; padding:10px 18px; font-weight:600;
             cursor:pointer; }

    /* Header "Restart" link — clears onboarding so the exec demo can re-show it. */
    header .restart-link {
      color:var(--muted); text-decoration:none; font-size:11px;
      padding:4px 8px; border-radius:6px; opacity:.75;
    }
    header .restart-link:hover { color:var(--txt); background:#1a242a; opacity:1; }

    /* -------- Onboarding modal (first-visit) -------------------------- */
    #onboard-overlay {
      position:fixed; inset:0; background:rgba(11,20,26,0.94);
      backdrop-filter:blur(6px); z-index:100;
      display:flex; align-items:center; justify-content:center; padding:20px;
    }
    #onboard-card {
      background:var(--panel); border:1px solid #222d34; border-radius:16px;
      width:100%; max-width:440px; padding:26px 28px 22px;
      box-shadow:0 20px 60px rgba(0,0,0,0.5);
    }
    #onboard-card .big-avatar {
      width:80px; height:80px; border-radius:50%; background:var(--accent);
      display:grid; place-items:center; margin:0 auto 14px;
      color:#03110d; font-weight:800; font-size:28px; letter-spacing:1px;
      box-shadow:0 0 0 4px rgba(0,168,132,0.18);
    }
    #onboard-card h2 { text-align:center; margin:0 0 6px; font-size:20px; }
    #onboard-card .lede {
      text-align:center; color:var(--muted); font-size:13px; line-height:1.5;
      margin:0 0 18px;
    }
    #onboard-form .row { display:flex; flex-direction:column; gap:5px; margin-bottom:12px; }
    #onboard-form .row-2col { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    #onboard-form label {
      font-size:12px; color:var(--muted); font-weight:600;
      text-transform:uppercase; letter-spacing:0.6px;
    }
    #onboard-form input, #onboard-form select {
      background:var(--in); color:var(--txt); border:1px solid #2a3942;
      border-radius:8px; padding:9px 12px; font-size:14px; width:100%;
      font-family:inherit;
    }
    #onboard-form input:focus, #onboard-form select:focus {
      outline:none; border-color:var(--accent);
    }
    #onboard-form .consent {
      display:flex; align-items:flex-start; gap:8px;
      font-size:12px; color:var(--muted); line-height:1.4;
      margin:14px 0 6px;
    }
    #onboard-form .consent input { width:16px; height:16px; margin-top:2px; flex-shrink:0; }
    #onboard-form .consent a { color:var(--accent); text-decoration:none; }
    #onboard-form .consent a:hover { text-decoration:underline; }
    #onboard-form .actions {
      display:flex; align-items:center; justify-content:space-between;
      gap:10px; margin-top:14px;
    }
    #onboard-form button.primary {
      flex:1; background:var(--accent); color:#03110d; border:none;
      border-radius:22px; padding:12px 18px; font-weight:700; font-size:14px;
      cursor:pointer; transition:opacity .15s, transform .05s;
    }
    #onboard-form button.primary:disabled {
      opacity:0.4; cursor:not-allowed;
    }
    #onboard-form button.primary:not(:disabled):hover { opacity:0.92; }
    #onboard-form button.primary:not(:disabled):active { transform:translateY(1px); }
    #onboard-form .skip {
      background:none; border:none; color:var(--muted); font-size:12px;
      cursor:pointer; padding:6px 8px; text-decoration:underline;
      font-family:inherit;
    }
    #onboard-form .skip:hover { color:var(--txt); }
  </style>
</head>
<body>
  <header>
    <div class="avatar">AI</div>
    <div>
      <h1>EduConnect AI Tutor</h1>
      <div class="status"><span class="dot"></span>online</div>
    </div>
    <div class="meta">
      <select id="grade" title="CAPS Grade">
        <option value="R">Gr R</option>
        <option value="1">Gr 1</option>
        <option value="2">Gr 2</option>
        <option value="3">Gr 3</option>
        <option value="4">Gr 4</option>
        <option value="5">Gr 5</option>
        <option value="6">Gr 6</option>
        <option value="7">Gr 7</option>
        <option value="8">Gr 8</option>
        <option value="9">Gr 9</option>
        <option value="10">Gr 10</option>
        <option value="11">Gr 11</option>
        <option value="12" selected>Gr 12</option>
      </select>
      <select id="lang" title="Language">
        <option value="">auto</option>
        <optgroup label="Educator-validated">
          <option value="en">English</option>
          <option value="af">Afrikaans</option>
          <option value="zu">isiZulu</option>
          <option value="xh">isiXhosa</option>
        </optgroup>
        <optgroup label="First-pass">
          <option value="nso">Sepedi</option>
          <option value="st">Sesotho</option>
          <option value="tn">Setswana</option>
          <option value="ss">siSwati</option>
          <option value="ve">Tshivenda</option>
          <option value="ts">Xitsonga</option>
          <option value="nr">isiNdebele</option>
        </optgroup>
      </select>
      <a class="restart-link" href="#" id="restart-link"
         title="Reset onboarding (Shift+click for a fresh learner id)">&#128274; Restart</a>
      <a class="menu-link" href="/ussd-simulator" title="Switch to USSD simulator">&#8801;</a>
    </div>
  </header>

  <!-- First-visit onboarding modal. Suppressed when localStorage says
       the learner has already onboarded. The "Restart" link in the
       header clears that flag so the exec demo can re-play it. -->
  <div id="onboard-overlay" style="display:none;">
    <div id="onboard-card">
      <div class="big-avatar">AI</div>
      <h2>Welcome to EduConnect AI Tutor</h2>
      <p class="lede">
        Before we start, tell us a bit about yourself. This helps us tailor
        the experience &mdash; and helps our educators improve. Nothing
        personal is shared.
      </p>
      <form id="onboard-form" autocomplete="off">
        <div class="row">
          <label for="ob-name">Name <span style="text-transform:none;font-weight:400;">(first name only, optional)</span></label>
          <input id="ob-name" type="text" placeholder="e.g. Thandi" maxlength="40" />
        </div>
        <div class="row row-2col">
          <div>
            <label for="ob-age">Age *</label>
            <input id="ob-age" type="number" min="5" max="18" placeholder="5–18" required />
          </div>
          <div>
            <label for="ob-grade">Grade *</label>
            <select id="ob-grade" required>
              <option value="R">Gr R</option>
              <option value="1">Gr 1</option>
              <option value="2">Gr 2</option>
              <option value="3">Gr 3</option>
              <option value="4">Gr 4</option>
              <option value="5">Gr 5</option>
              <option value="6">Gr 6</option>
              <option value="7">Gr 7</option>
              <option value="8">Gr 8</option>
              <option value="9">Gr 9</option>
              <option value="10">Gr 10</option>
              <option value="11">Gr 11</option>
              <option value="12" selected>Gr 12</option>
            </select>
          </div>
        </div>
        <div class="row">
          <label for="ob-school">School <span style="text-transform:none;font-weight:400;">(optional)</span></label>
          <input id="ob-school" type="text" placeholder="e.g. Soweto Secondary" maxlength="80" />
        </div>
        <div class="row">
          <label for="ob-lang">Language *</label>
          <select id="ob-lang" required>
            <optgroup label="Educator-validated">
              <option value="en" selected>English</option>
              <option value="af">Afrikaans</option>
              <option value="zu">isiZulu</option>
              <option value="xh">isiXhosa</option>
            </optgroup>
            <optgroup label="First-pass">
              <option value="nso">Sepedi</option>
              <option value="st">Sesotho</option>
              <option value="tn">Setswana</option>
              <option value="ss">siSwati</option>
              <option value="ve">Tshivenda</option>
              <option value="ts">Xitsonga</option>
              <option value="nr">isiNdebele</option>
            </optgroup>
          </select>
        </div>
        <label class="consent">
          <input id="ob-consent" type="checkbox" required />
          <span>
            I understand my anonymous usage helps improve the tutor.
            POPIA-aligned. <a href="#" target="_blank" rel="noopener">Learn more</a>
          </span>
        </label>
        <div class="actions">
          <button type="submit" class="primary" id="ob-submit" disabled>Start Learning &rarr;</button>
          <button type="button" class="skip" id="ob-skip">Skip for now</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Retained (hidden) so a USSD deep-link handoff query still has a place to
       render meta if we choose to surface it. Not visible by default. -->
  <div id="handoff-ribbon"></div>

  <div id="chat"></div>

  <form id="composer" autocomplete="off">
    <input id="text" autocomplete="off" placeholder="Message" />
    <button id="send" type="submit">Send</button>
  </form>

  <script>
    const chat = document.getElementById('chat');
    const userId = (function loadOrCreateUserId() {
      // Persist the learner's session id in localStorage so the analytics DB
      // sees the same person across reloads, tabs, and days. Only regenerate
      // if localStorage is unavailable or the key hasn't been set yet.
      try {
        const existing = localStorage.getItem('educonnect_user_id');
        if (existing) return existing;
      } catch (e) { /* private browsing etc. */ }
      const fresh = 'web-' + Math.random().toString(36).slice(2, 10);
      try { localStorage.setItem('educonnect_user_id', fresh); } catch (e) {}
      return fresh;
    })();

    function bubble(text, cls) {
      const d = document.createElement('div');
      d.className = 'msg ' + cls;
      d.textContent = text;
      chat.appendChild(d);
      chat.scrollTop = chat.scrollHeight;
      return d;
    }

    function botMessage(text, quickReplies) {
      // A bot message consists of a bubble AND (optionally) a row of
      // WhatsApp Business Interactive Reply Buttons rendered directly
      // beneath it — Meta caps this at 3 buttons per message.
      const group = document.createElement('div');
      group.className = 'bot-group';
      const bub = document.createElement('div');
      bub.className = 'msg bot';
      bub.textContent = text;
      group.appendChild(bub);
      if (Array.isArray(quickReplies) && quickReplies.length) {
        const row = document.createElement('div');
        row.className = 'quick-replies';
        quickReplies.slice(0, 3).forEach(qr => {
          const btn = document.createElement('button');
          btn.className = 'quick-reply';
          btn.type = 'button';
          btn.textContent = qr.label;
          btn.dataset.payload = qr.payload || '';
          if (qr.disabled) {
            btn.disabled = true;
          } else {
            btn.addEventListener('click', () => handleQuickReply(qr, btn));
          }
          row.appendChild(btn);
        });
        group.appendChild(row);
      }
      chat.appendChild(group);
      chat.scrollTop = chat.scrollHeight;
    }

    function diagBubble(d) {
      if (!d) return;
      const el = document.createElement('div');
      el.className = 'diag';
      const err = d.first_error_step === null ? 'none'
                  : ('step ' + (d.first_error_step + 1));
      let html = '<b>diagnosis</b> · correct: ' + d.is_correct
        + ' · first error: ' + err + ' · misconception: ' + d.misconception;
      if (d.summary) html += '<br/>' + d.summary;
      if (d.caps_topic) html += '<br/><span style="color:#7ed4b9">&#128218; ' + d.caps_topic + '</span>';
      if (d.caps_subskill) html += '<br/><span style="color:#7ed4b9">&#127919; ' + d.caps_subskill + '</span>';
      el.innerHTML = html;
      chat.appendChild(el);
      chat.scrollTop = chat.scrollHeight;
    }

    function disableAllQuickReplies() {
      // Once the learner has committed to a choice, older button rows should
      // no longer be tappable — this matches how WhatsApp Business greys out
      // stale interactive reply buttons after selection.
      document.querySelectorAll('.quick-reply').forEach(b => { b.disabled = true; });
    }

    async function postChat(body) {
      const lang = document.getElementById('lang').value || null;
      const grade = document.getElementById('grade').value || null;
      const payload = Object.assign({ user_id: userId, language: lang, grade: grade }, body);
      const res = await fetch('/api/chat', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
      });
      return await res.json();
    }

    async function sendText(text) {
      bubble(text, 'user');
      // Older button rows stay tappable — matches real WhatsApp Business.
      const data = await postChat({ text: text });
      botMessage(data.text, data.quick_replies);
      diagBubble(data.diagnosis);
    }

    async function handleQuickReply(qr, btnEl) {
      // Echo the button label as the learner's message bubble.
      bubble(qr.label, 'user');
      // Real WhatsApp Business greys out buttons ONLY in the message that
      // was tapped — buttons in older messages remain tappable so learners
      // can re-navigate. Match that behaviour.
      const row = btnEl && btnEl.closest && btnEl.closest('.quick-replies');
      if (row) {
        row.querySelectorAll('.quick-reply').forEach(b => { b.disabled = true; });
      }
      // Terminal question buttons carry the past-paper id inside their
      // payload — unpack and route through the past_paper_id field so the
      // engine's existing _handle_past_paper still triggers.
      const payload = qr.payload || '';
      let body;
      if (payload.startsWith('pastpapers:question:')) {
        const rest = payload.slice('pastpapers:question:'.length);
        body = { past_paper_id: rest };
      } else {
        body = { payload: payload };
      }
      const data = await postChat(body);
      botMessage(data.text, data.quick_replies);
      diagBubble(data.diagnosis);
    }

    document.getElementById('composer').addEventListener('submit', e => {
      e.preventDefault();
      const t = document.getElementById('text');
      if (t.value.trim()) { sendText(t.value.trim()); t.value = ''; }
    });

    // ------------------------------------------------------------------
    // Onboarding modal wiring
    // ------------------------------------------------------------------
    const onboardOverlay = document.getElementById('onboard-overlay');
    const onboardForm = document.getElementById('onboard-form');
    const obName    = document.getElementById('ob-name');
    const obAge     = document.getElementById('ob-age');
    const obGrade   = document.getElementById('ob-grade');
    const obSchool  = document.getElementById('ob-school');
    const obLang    = document.getElementById('ob-lang');
    const obConsent = document.getElementById('ob-consent');
    const obSubmit  = document.getElementById('ob-submit');
    const obSkip    = document.getElementById('ob-skip');

    function validateOnboard() {
      // Submit is enabled once required fields are all populated. The name
      // field is deliberately optional; age is required and range-checked.
      const age = parseInt(obAge.value, 10);
      const ageOk = Number.isFinite(age) && age >= 5 && age <= 18;
      const gradeOk = !!obGrade.value;
      const langOk = !!obLang.value;
      const consentOk = obConsent.checked;
      obSubmit.disabled = !(ageOk && gradeOk && langOk && consentOk);
    }
    ['input','change'].forEach(evt => onboardForm.addEventListener(evt, validateOnboard));

    async function startGreeting() {
      // The normal greeting flow, extracted so it can be called from either
      // page load (already onboarded) or right after the modal is dismissed.
      const qs = new URLSearchParams(window.location.search);
      if (qs.get('from') === 'ussd') {
        const lang = qs.get('lang');
        if (lang) document.getElementById('lang').value = lang;
        const problem = qs.get('problem') || '';
        const working = qs.get('working') || '';
        const seed = working ? (problem + '\n' + working) : problem;
        if (seed.trim()) { sendText(seed.trim()); return; }
      }
      const data = await postChat({ text: 'hi' });
      botMessage(data.text, data.quick_replies);
      diagBubble(data.diagnosis);
    }

    async function completeOnboarding(profile) {
      // Sync the header dropdowns with the learner's choices so the rest of
      // the chat reflects the picked grade/language without a page reload.
      if (profile.grade)    document.getElementById('grade').value = profile.grade;
      if (profile.language) document.getElementById('lang').value  = profile.language;
      try {
        await fetch('/api/onboard', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({
            user_id: userId,
            name_first: profile.name_first || null,
            age: profile.age || null,
            grade: profile.grade || null,
            language: profile.language || null,
            school: profile.school || null,
          }),
        });
      } catch (e) {
        // Analytics is fire-and-forget on the frontend too — never block the
        // learner from starting because a POST hiccupped.
      }
      try { localStorage.setItem('educonnect_onboarded', '1'); } catch (e) {}
      onboardOverlay.style.display = 'none';
      startGreeting();
    }

    onboardForm.addEventListener('submit', (e) => {
      e.preventDefault();
      if (obSubmit.disabled) return;
      completeOnboarding({
        name_first: (obName.value || '').trim() || null,
        age: parseInt(obAge.value, 10) || null,
        grade: obGrade.value || null,
        school: (obSchool.value || '').trim() || null,
        language: obLang.value || null,
      });
    });

    obSkip.addEventListener('click', () => {
      // "Skip for now" defaults: Grade 12, English — same as the header.
      completeOnboarding({ grade: '12', language: 'en' });
    });

    document.getElementById('restart-link').addEventListener('click', (e) => {
      e.preventDefault();
      // Soft reset: clear onboarding flag so the modal shows again, but KEEP
      // the persisted user_id so analytics still see the same learner. Hold
      // Shift while clicking (or check ?hard=1 in the URL) for a full reset
      // that also cycles the user_id — useful for cold "new learner" demos.
      const hard = e.shiftKey || new URLSearchParams(window.location.search).get('hard') === '1';
      try {
        localStorage.removeItem('educonnect_onboarded');
        if (hard) localStorage.removeItem('educonnect_user_id');
      } catch (err) {}
      window.location.reload();
    });

    window.addEventListener('load', () => {
      let onboarded = false;
      try { onboarded = !!localStorage.getItem('educonnect_onboarded'); } catch (e) {}
      if (onboarded) {
        // Returning learner: straight to the greeting, no modal.
        startGreeting();
      } else {
        // First visit: show the modal, defer the greeting until dismissed.
        onboardOverlay.style.display = 'flex';
        validateOnboard();
      }
    });
  </script>
</body>
</html>
