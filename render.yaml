services:
  - type: web
    name: educonnect-tutor
    env: python
    plan: free
    buildCommand: |
      pip install --upgrade pip &&
      pip install --only-binary=:all: -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.15
      - key: APP_ENV
        value: production
