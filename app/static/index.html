<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Tutor — Demo Simulator</title>
  <style>
    :root { --bg:#0b141a; --panel:#111b21; --in:#202c33; --out:#005c4b;
            --accent:#00a884; --txt:#e9edef; --muted:#8696a0; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,Segoe UI,Roboto,sans-serif;
           background:var(--bg); color:var(--txt); height:100vh; display:flex;
           flex-direction:column; }
    header { background:var(--panel); padding:12px 16px; display:flex;
             align-items:center; gap:12px; border-bottom:1px solid #222d34; }
    header .avatar { width:40px; height:40px; border-radius:50%;
             background:var(--accent); display:grid; place-items:center;
             font-weight:700; }
    header h1 { font-size:16px; margin:0; }
    header p { font-size:12px; color:var(--muted); margin:2px 0 0; }
    .lang { margin-left:auto; }
    select { background:var(--in); color:var(--txt); border:1px solid #2a3942;
             border-radius:8px; padding:6px 8px; }
    #chat { flex:1; overflow-y:auto; padding:18px; display:flex;
            flex-direction:column; gap:8px; }
    .msg { max-width:78%; padding:8px 12px; border-radius:10px; font-size:14px;
           line-height:1.4; white-space:pre-wrap; word-wrap:break-word; }
    .user { align-self:flex-end; background:var(--out); }
    .bot  { align-self:flex-start; background:var(--in); }
    .imgmsg { align-self:flex-end; background:var(--out); padding:6px;
              border-radius:10px; max-width:60%; }
    .imgmsg img { display:block; max-width:100%; border-radius:6px; }
    .imgmsg .cap { font-size:12px; color:#cbe7e0; margin-top:6px; padding:0 4px;
                   white-space:pre-wrap; }
    .diag { align-self:flex-start; max-width:78%; font-size:12px;
            color:var(--muted); background:#0e171d; border:1px dashed #2a3942;
            border-radius:8px; padding:8px 10px; }
    .diag b { color:var(--accent); }
    .quick { background:#2a3942; color:var(--txt); border:none;
             border-radius:14px; padding:6px 10px; font-size:12px;
             cursor:pointer; }
    .quick:hover { background:#36454f; }
    #upload-panel { display:none; padding:10px 16px; background:#0e171d;
             border-top:1px solid #222d34; gap:8px; align-items:flex-start; }
    #upload-panel.show { display:flex; flex-wrap:wrap; }
    #upload-panel textarea { flex:1; min-width:240px; min-height:90px;
             background:var(--in); color:var(--txt); border:1px solid #2a3942;
             border-radius:8px; padding:8px; font-family:monospace;
             font-size:13px; }
    #upload-panel .preview { width:120px; height:120px; border-radius:8px;
             background:#1a2a32 center/cover no-repeat; border:1px dashed #2a3942;
             display:grid; place-items:center; color:var(--muted); font-size:11px;
             text-align:center; padding:6px; }
    .btn-primary { background:var(--accent); color:#03110d; border:none;
             border-radius:14px; padding:8px 14px; font-weight:600;
             cursor:pointer; }
    .btn-secondary { background:#2a3942; color:var(--txt); border:none;
             border-radius:14px; padding:8px 14px; cursor:pointer; }
    #handoff-ribbon { display:none; padding:8px 16px;
             background:linear-gradient(90deg, #003c0a, #015c2c);
             color:#9cff8c; font-size:12px; border-bottom:1px solid #00a884; }
    #handoff-ribbon.show { display:block; }
    #handoff-ribbon b { color:#ffffff; }
  </style>
</head>
<body>
  <header>
    <div class="avatar">AI</div>
    <div>
      <h1>AI Maths Tutor</h1>
      <p>CAPS-aligned · WhatsApp/USSD prototype · mock mode · <a href="/ussd-simulator" style="color:var(--accent)">switch to USSD simulator</a></p>
    </div>
    <div class="lang">
      <select id="grade" title="CAPS Grade" style="margin-right:6px;">
        <option value="8" disabled>Grade 8 (soon)</option>
        <option value="9" selected>Grade 9</option>
        <option value="10" disabled>Grade 10 (soon)</option>
        <option value="11" disabled>Grade 11 (soon)</option>
        <option value="12" disabled>Grade 12 (soon)</option>
      </select>
      <select id="lang" title="Language">
        <option value="">auto-detect</option>
        <option value="en">English</option>
        <option value="af">Afrikaans</option>
        <option value="zu">isiZulu</option>
        <option value="xh">isiXhosa</option>
      </select>
    </div>
  </header>

  <div id="handoff-ribbon"><b>📲 ↳ continued from USSD.</b> Carrying your problem and language across.</div>

  <div id="chat"></div>

  <!-- Optional image-upload composer (toggled by the 📎 button) -->
  <div id="upload-panel">
    <div id="preview" class="preview">No image picked</div>
    <textarea id="upload-text" placeholder="Type the working as it appears in the image, one step per line — e.g.&#10;2x + 3 = 7&#10;2x = 7 + 3&#10;2x = 10&#10;x = 5"></textarea>
    <div style="display:flex; flex-direction:column; gap:6px;">
      <button class="btn-primary" id="upload-send">Send screenshot</button>
      <button class="btn-secondary" id="upload-cancel">Cancel</button>
    </div>
    <input type="file" id="file-input" accept="image/*" style="display:none" />
  </div>

  <!-- Quick-action shortcuts -->
  <div style="padding:10px 16px; display:flex; gap:8px; flex-wrap:wrap;
              background:var(--panel); border-top:1px solid #222d34;">
    <button class="quick" data-send="hi">👋 Start</button>
    <button class="quick" data-img="2x + 3 = 7&#10;2x = 7 + 3&#10;2x = 10&#10;x = 5">
      📷 Wrong working (preset)</button>
    <button class="quick" data-img="5x - 2 = 2x + 7&#10;5x - 2x = 7 + 2&#10;3x = 9&#10;x = 3">
      📷 Correct working (preset)</button>
    <button class="quick" id="open-upload">📎 Upload your own</button>
    <button class="quick" data-send="hint">💡 Hint</button>
    <button class="quick" data-send="reset">🔄 Reset</button>
  </div>

  <form id="composer" style="display:flex; gap:8px; padding:12px 16px;
        background:var(--panel);">
    <input id="text" autocomplete="off" placeholder="Type a problem, e.g. 2x+3=7"
      style="flex:1; background:var(--in); color:var(--txt); border:none;
             border-radius:20px; padding:10px 16px; font-size:14px;" />
    <button id="send" style="background:var(--accent); color:#03110d;
      border:none; border-radius:20px; padding:10px 18px; font-weight:600;
      cursor:pointer;">Send</button>
  </form>

  <script>
    const chat = document.getElementById('chat');
    const userId = 'web-' + Math.random().toString(36).slice(2, 8);
    let pendingImageDataUrl = null;

    function bubble(text, cls) {
      const d = document.createElement('div');
      d.className = 'msg ' + cls;
      d.textContent = text;
      chat.appendChild(d);
      chat.scrollTop = chat.scrollHeight;
    }
    function imageBubble(dataUrl, caption) {
      const wrap = document.createElement('div');
      wrap.className = 'imgmsg';
      const img = document.createElement('img');
      img.src = dataUrl;
      wrap.appendChild(img);
      if (caption) {
        const c = document.createElement('div');
        c.className = 'cap';
        c.textContent = caption;
        wrap.appendChild(c);
      }
      chat.appendChild(wrap);
      chat.scrollTop = chat.scrollHeight;
    }
    function diagBubble(d) {
      if (!d) return;
      const el = document.createElement('div');
      el.className = 'diag';
      const err = d.first_error_step === null ? 'none'
                  : ('step ' + (d.first_error_step + 1));
      let html = '<b>diagnosis</b> · correct: ' + d.is_correct
        + ' · first error: ' + err + ' · misconception: ' + d.misconception;
      if (d.summary) html += '<br/>' + d.summary;
      if (d.caps_topic) html += '<br/><span style="color:#7ed4b9">📘 ' + d.caps_topic + '</span>';
      if (d.caps_subskill) html += '<br/><span style="color:#7ed4b9">🎯 ' + d.caps_subskill + '</span>';
      el.innerHTML = html;
      chat.appendChild(el);
      chat.scrollTop = chat.scrollHeight;
    }

    async function send({text, image, imageDataUrl}) {
      const lang = document.getElementById('lang').value || null;
      const grade = document.getElementById('grade').value || null;
      if (text && !image) bubble(text, 'user');
      if (image && imageDataUrl) imageBubble(imageDataUrl, image);
      else if (image) bubble('📷 [screenshot of working]\n' + image, 'user');
      const body = { user_id: userId, language: lang, grade: grade };
      if (image) body.image_caption = image; else body.text = text;
      const res = await fetch('/api/chat', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(body)
      });
      const data = await res.json();
      bubble(data.text, 'bot');
      diagBubble(data.diagnosis);
    }

    // Composer (text input)
    document.getElementById('composer').addEventListener('submit', e => {
      e.preventDefault();
      const t = document.getElementById('text');
      if (t.value.trim()) { send({text: t.value.trim()}); t.value = ''; }
    });

    // Quick-action buttons
    document.querySelectorAll('.quick').forEach(b => {
      if (b.id) return;  // skip 📎 (handled below)
      b.addEventListener('click', () => {
        if (b.dataset.img) send({image: b.dataset.img});
        else send({text: b.dataset.send});
      });
    });

    // 📎 Upload your own — open the upload panel + file picker
    const panel = document.getElementById('upload-panel');
    const fileInput = document.getElementById('file-input');
    const preview = document.getElementById('preview');
    const uploadText = document.getElementById('upload-text');

    document.getElementById('open-upload').addEventListener('click', () => {
      panel.classList.add('show');
      fileInput.click();
    });
    fileInput.addEventListener('change', () => {
      const f = fileInput.files[0];
      if (!f) return;
      const reader = new FileReader();
      reader.onload = e => {
        pendingImageDataUrl = e.target.result;
        preview.style.backgroundImage = 'url(' + pendingImageDataUrl + ')';
        preview.textContent = '';
      };
      reader.readAsDataURL(f);
    });
    document.getElementById('upload-send').addEventListener('click', () => {
      const working = uploadText.value.trim();
      if (!working) {
        alert('Type the working that the image shows (one step per line) so the tutor can analyse it.');
        return;
      }
      send({image: working, imageDataUrl: pendingImageDataUrl});
      uploadText.value = '';
      pendingImageDataUrl = null;
      preview.style.backgroundImage = '';
      preview.textContent = 'No image picked';
      fileInput.value = '';
      panel.classList.remove('show');
    });
    document.getElementById('upload-cancel').addEventListener('click', () => {
      uploadText.value = '';
      pendingImageDataUrl = null;
      preview.style.backgroundImage = '';
      preview.textContent = 'No image picked';
      fileInput.value = '';
      panel.classList.remove('show');
    });

    window.addEventListener('load', () => {
      // Channel handoff: a USSD session ended with a "Continue on WhatsApp"
      // button that landed us here with ?from=ussd&problem=...&lang=...
      const qs = new URLSearchParams(window.location.search);
      if (qs.get('from') === 'ussd') {
        document.getElementById('handoff-ribbon').classList.add('show');
        const lang = qs.get('lang');
        if (lang) document.getElementById('lang').value = lang;
        const problem = qs.get('problem') || '';
        const working = qs.get('working') || '';
        const seed = working ? (problem + '\n' + working) : problem;
        if (seed.trim()) {
          send({text: seed.trim()});
          return;
        }
      }
      send({text: 'hi'});
    });
  </script>
</body>
</html>
